<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha - Music Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="player-container">
      <div class="player-header">CodeAlpha Music Player</div>

      <!-- Track Details -->
      <div class="track-info">
        <img
          id="cover-art"
          src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800"
          alt="Cover Art"
        />
        <h2 id="track-title">Song Title</h2>
        <p id="track-artist">Artist Name</p>
      </div>

      <!-- Hidden HTML5 Audio Element -->
      <audio id="audio-player"></audio>

      <!-- Progress Bar -->
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" max="100" />
        <span id="total-duration">0:00</span>
      </div>

      <!-- Control Buttons -->
      <div class="controls">
        <button id="prev-btn" class="control-btn" title="Previous">
          &#10094;&#10094;
        </button>
        <button id="play-btn" class="control-btn play-btn" title="Play/Pause">
          &#9654;
        </button>
        <button id="next-btn" class="control-btn" title="Next">
          &#10095;&#10095;
        </button>
      </div>

      <!-- Volume Control -->
      <div class="volume-container">
        <span class="volume-icon">&#128066;</span>
        <input type="range" id="volume-bar" value="100" min="0" max="100" />
      </div>

      <!-- Playlist Section -->
      <div class="playlist-section">
        <h3>Playlist</h3>
        <ul id="playlist" class="playlist"></ul>
      </div>

      <!-- Footer -->
      <footer class="app-footer">Made by Yishak</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
